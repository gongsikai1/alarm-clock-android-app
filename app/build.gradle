plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.audioalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.audioalarm"
        minSdk 24
        targetSdk 33
        versionCode 5
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
